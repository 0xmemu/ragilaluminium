# Dev VPS preview — Nginx serves static assets concurrently; PHP via php-fpm.
# Install: sudo bash scripts/dev-vps/serve-dev.sh
# Listens on :8200 to match APP_URL (http://VPS_IP:8200).

server {
    listen 8200;
    listen [::]:8200;
    server_name _;

    root /var/www/ragilaluminium/public;
    index index.php;

    client_max_body_size 64M;

    # Built Vite / images / favicons — never block PHP on these.
    location ^~ /build/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /images/ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # Same-origin proxy for Cloudflare R2 public objects. serve-dev.sh injects
    # MEDIA_R2_HOST from the environment; the block is omitted when unset.
    # MEDIA_PROXY_BEGIN
    location ^~ /media-cdn/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host __MEDIA_R2_HOST__;
        proxy_pass https://__MEDIA_R2_HOST__/;
    }
    # MEDIA_PROXY_END

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ==============================================================================
# NGINX PRODUCTION CONFIG: ragilaluminium.com, www, & api
# Menangani: Storefront, Panel Admin, WebSocket Reverb, & Webhook J&T Cargo
# ==============================================================================

# 1. Konfigurasi Real-IP Cloudflare (agar Laravel mencatat IP asli pembeli)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# 2. Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ragilaluminium.com www.ragilaluminium.com api.ragilaluminium.com;
    return 301 https://$host$request_uri;
}

# 3. Server HTTPS Utama
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ragilaluminium.com www.ragilaluminium.com api.ragilaluminium.com;

    root /root/ragilaluminium/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # SSL (Gunakan Cloudflare Origin CA atau Certbot)
    ssl_certificate     /etc/ssl/certs/ragilaluminium.com.pem;
    ssl_certificate_key /etc/ssl/private/ragilaluminium.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # WebSocket Proxy -> Laravel Reverb (Port 8080)
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Webhook J&T Cargo & WhatsApp (Tanpa batasan ketat)
    location ^~ /webhook/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset Vite Build (Cache Panjang)
    location /build/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Public Storage Assets
    location /storage/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Route Utama Laravel (Inertia React)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    # PHP-FPM FastCGI
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Impor katalog Excel dan unggah media melewati batas bawaan nginx 1 MB.
client_max_body_size 64M;
fastcgi_read_timeout 60s;

# Pembatas laju endpoint polling notifikasi panel admin.
# Latar: endpoint ini dipanggil panel admin tiap 8 detik. Dengan sekitar 12 tab
# admin terbuka, puncaknya pernah 93 permintaan per menit, dan tiap permintaan
# menjalankan query agregat ke 14 tabel. Itu menumpuk di kolam PHP dan pernah
# membuat toko membeku beberapa menit.
# Angka 120 per menit dipilih supaya kerja normal (sampai sekitar 16 tab dengan
# interval 8 detik) TIDAK terganggu, tetapi ledakan karena bug atau puluhan tab
# tetap terpotong. Setelah polling turun frekuensi, batas ini bisa diturunkan.
limit_req_zone $binary_remote_addr zone=adminpoll:10m rate=120r/m;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

# Vhost produksi Ragil Aluminium di VPS 202.74.74.87.
# Disiapkan 2026-09-20, BELUM diaktifkan. Aktivasi lewat /root/ragil-backup/cutover-to-laravel.sh.
#
# Catatan penting saat cutover:
# 1. Ganti vhost standby: berkas ini menggantikan konfigurasi yang membalas ACK J&T
#    secara hardcoded. Setelah aktif, webhook J&T ditangani Laravel, bukan nginx.
# 2. Panel admin dilayani di path /admin pada origin yang sama, bukan subdomain.
#    Record DNS admin.ragilaluminium.com adalah sisa era Docker dan tidak dipakai
#    (tidak ada di SAN sertifikat origin, jadi akan gagal pada SSL Full strict).
# 3. api.ragilaluminium.com dipertahankan karena konsol J&T sudah mendaftarkan
#    endpoint webhook di sana. Ini alias webhook, bukan host API terpisah.
server {
    listen 80;
    listen [::]:80;
    server_name ragilaluminium.com www.ragilaluminium.com api.ragilaluminium.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ragilaluminium.com www.ragilaluminium.com api.ragilaluminium.com;

    root /var/www/ragilaluminium/current/public;
    index index.php index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ragilaluminium.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragilaluminium.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebSocket Laravel Reverb (notifikasi live panel admin).
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Pembatas laju khusus endpoint polling notifikasi panel admin.
    # Wajib lokasi terpisah: limit_req di dalam blok location ~ \.php$ tidak
    # berlaku, karena permintaan diarahkan ke sana lewat try_files, bukan cocok
    # langsung. Blok exact ini cocok lebih dulu dan tetap meneruskan ke Laravel.
    location = /admin/notifications/poll {
        limit_req zone=adminpoll burst=30 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /storage/ {
        try_files $uri $uri/ =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Tantangan ACME ---
    # certbot me-renew dengan webroot /var/www/html. Lokasi ini menjaga perpanjangan
    # SSL tetap berhasil setelah domain dilayani aplikasi, karena berkas tantangan
    # tetap dibaca dari webroot lama.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Turun dari 300 detik. Dengan 300 detik, satu permintaan yang macet
        # menahan satu pekerja PHP sampai 5 menit, sehingga antrean menumpuk dan
        # seluruh toko bisa membeku. 60 detik cukup untuk request admin terberat.
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release artifact + manifest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.3"
          extensions: mbstring, intl, bcmath, exif, gd, zip, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install PHP dependencies (prod)
        run: composer install --no-interaction --prefer-dist --no-dev --no-progress

      - name: Install frontend dependencies + build
        run: |
          npm ci
          npm run build

      - name: Run PHPUnit regression gate
        run: php artisan test

      - name: Generate release manifest
        run: |
          mkdir -p artifacts
          cat > artifacts/manifest.json <<EOF
          {
            "git_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref_name }}",
            "build_time": "${{ steps.meta.outputs.time }}",
            "php": "$(php -v | head -1 | grep -oP 'PHP \K[0-9.]+')",
            "node": "$(node -v | grep -oP 'v\K[0-9.]+')",
            "composer": "$(composer --version 2>/dev/null | grep -oP 'Composer version \K[0-9.]+')",
            "asset_manifest": "$(sha256sum public/build/manifest.json 2>/dev/null | cut -d' ' -f1)"
          }
          EOF
          echo "manifest: $(cat artifacts/manifest.json)"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: |
            artifacts/
            public/build/
            composer.lock
          if-no-files-found: error
          retention-days: 30